{% set name = "opentile" %}
{% set version = "0.27.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/opentile-{{ version }}.tar.gz
  sha256: 63771ddaaf10d928d88524064b1e245c14677194f49f91ae42410279b042ab45

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry
    - hatchling
  run:
    - python >={{ python_min }}
    - numpy >=1.22.0
    - imagecodecs >=2022.12.24
    - tifffile >=2026.7.14
    - pillow >=10.1.0
    - pyturbojpeg >=1.7.3,<2.0.0
    - cachetools >=5.0.0
    - defusedxml >=0.7.1
    - fsspec >=2024.2.0
    - ome-types >=0.5.0
    - universal-pathlib >=0.3.0,<1.0.0
    - lxml >=4.9.0

test:
  imports:
    - opentile
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/imi-bigpicture/opentile
  summary: Read tiles from wsi-TIFF files
  license: Apache-2.0
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - sarthakpati
